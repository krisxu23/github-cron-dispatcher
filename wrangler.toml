name = "github-cron-dispatcher"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ==================================================
# Cron 触发器（UTC 时间）
# 示例：每天北京时间 10:40 / 16:40 / 22:40 / 04:40
# 即 UTC 02:40 / 08:40 / 14:40 / 20:40
# ==================================================
[triggers]
crons = ["40 2,8,14,20 * * *"]
